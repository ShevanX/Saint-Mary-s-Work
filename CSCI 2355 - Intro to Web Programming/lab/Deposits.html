<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Deposit Record</title>
    <style>
        table,
        th,
        td {
            border: 2px solid gray;
            padding: 4px;
        }
    </style>
</head>

<body>

    <table>
        <caption>
            <b>My Deposits: F234</b><br>
            <b>Shevan Walimini</b>
        </caption>

        <tr>
            <th rowspan="1"><b>Month</b></th>
            <td rowspan="4"><b>2<br>0<br>2<br>5</b></td>
            <th colspan="4"><b>Deposits</b></th>
        </tr>

        <tr>
            <td><b>September</b></td>
            <td>$800</td>
            <td>$5</td>
            <td>$245</td>
            <td>$50</td>
        </tr>

        <tr>
            <td><b>October</b></td>
            <td colspan="2">$2000</td>
            <td>$1300</td>
            <td>$650</td>
        </tr>

        <tr>
            <th><b>Total</b></th>
            <th colspan="4"><b>$5050</b></th>
        </tr>
    </table>

</body>

</html>
